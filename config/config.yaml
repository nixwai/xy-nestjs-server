app:
  environment: development
  port: 3000
  globalPrefix: api
cors:
  origins: []
database:
  enabled: true
  host: localhost
  port: 3306
  username: root
  password: ''
  database: app
  synchronize: false
jwt:
  secret: ''
  accessTokenExpiresIn: 15m
  refreshTokenExpiresIn: 7d
auth:
  rsaPrivateKey: ''
swagger:
  enabled: true
  path: docs
throttler:
  ttl: 60000
  limit: 100
