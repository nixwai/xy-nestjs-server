app:
  environment: development
  port: 3000
  globalPrefix: api
cors:
  origins: []
database:
  enabled: true
  host: localhost
  port: 3306
  username: root
  password: ''
  database: app
  synchronize: false
jwt:
  secret: ''
  accessTokenExpiresIn: 15m
  refreshTokenExpiresIn: 7d
auth:
  rsaPrivateKey: ''
swagger:
  enabled: true
  path: docs
oss:
  region: ''
  bucket: ''
  accessKeyId: ''
  accessKeySecret: ''
  publicBaseUrl: ''
image:
  quality: 75
  maxWidth: 3840
  maxHeight: 2160
  maxFileSize: 52428800
  maxFiles: 50
throttler:
  ttl: 60000
  limit: 100
